<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Surtido de Línea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
html{-webkit-text-size-adjust:100%} body{margin:0} [hidden]{display:none!important} img{max-width:100%}
/* Layout: barra de planta fija arriba, pestañas por rol, área de trabajo en tarjetas por estación (tablero andon). */
:root{
  --bg:#eef1f4; --panel:#ffffff; --panel-2:#f6f8fa; --line:#d5dbe2; --ink:#16202b; --ink-2:#4d5b6a; --ink-3:#7a8796;
  --accent:#0f5f8c; --accent-ink:#ffffff; --accent-soft:#dcebf5;
  --ok:#1d7a46; --ok-soft:#dcf1e4; --warn:#9a6200; --warn-soft:#fbecc9; --bad:#b3261e; --bad-soft:#f8dedb; --idle:#5b6878; --idle-soft:#e5e9ee;
  --bar:#16202b; --bar-ink:#e7edf3;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --panel:#17202a; --panel-2:#1c2632; --line:#2b3846; --ink:#e5ebf1; --ink-2:#a9b6c3; --ink-3:#7c8a99;
  --accent:#4fa8d8; --accent-ink:#06131c; --accent-soft:#163246;
  --ok:#5cc98a; --ok-soft:#143323; --warn:#e8b04a; --warn-soft:#3a2c0f; --bad:#f07d74; --bad-soft:#3d1916; --idle:#93a1b0; --idle-soft:#232e3a;
  --bar:#0a0f14; --bar-ink:#e5ebf1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --panel:#17202a; --panel-2:#1c2632; --line:#2b3846; --ink:#e5ebf1; --ink-2:#a9b6c3; --ink-3:#7c8a99;
  --accent:#4fa8d8; --accent-ink:#06131c; --accent-soft:#163246;
  --ok:#5cc98a; --ok-soft:#143323; --warn:#e8b04a; --warn-soft:#3a2c0f; --bad:#f07d74; --bad-soft:#3d1916; --idle:#93a1b0; --idle-soft:#232e3a;
  --bar:#0a0f14; --bar-ink:#e5ebf1; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
h2{font-size:26px}h3{font-size:19px}
.mono,td.num,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .small{font-size:12px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}

/* barra lateral: marca, menú por rol y usuario; en pantallas angostas pasa arriba */
.shell{display:flex;align-items:flex-start;min-height:100vh}
.side{background:var(--bar);color:var(--bar-ink);position:sticky;top:0;flex:0 0 232px;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:18px;padding:calc(18px + env(safe-area-inset-top,0px)) 0 calc(16px + env(safe-area-inset-bottom,0px)) max(0px,env(safe-area-inset-left,0px));overflow-y:auto;z-index:20}
.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:0 12px 0 18px}
.brand-t{display:grid;gap:4px;min-width:0}
.side-toggle{flex:0 0 32px;width:32px;height:32px;display:grid;place-items:center;background:transparent;color:var(--bar-ink);border:1px solid #ffffff40;border-radius:4px;cursor:pointer;opacity:.8}
.side-toggle:hover{opacity:1}
.side-toggle svg{width:18px;height:18px}
.brand h1{font-size:24px;line-height:1.05;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.brand .tag{font-family:var(--f-mono);font-size:11px;opacity:.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs{display:flex;flex-direction:column;gap:2px;flex:1}
nav.tabs button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;color:var(--bar-ink);border:0;border-left:4px solid transparent;padding:10px 18px 10px 14px;font:600 16px var(--f-display);text-transform:uppercase;letter-spacing:.06em;cursor:pointer;opacity:.7}
nav.tabs button svg{width:18px;height:18px;flex:0 0 18px}
nav.tabs button{position:relative}
.tab-n{margin-left:auto;font:600 11px var(--f-mono);background:var(--warn);color:#1a1200;border-radius:999px;padding:1px 7px;letter-spacing:0}
nav.tabs button[aria-current="page"]{opacity:1;border-left-color:var(--warn);background:#ffffff12}
nav.tabs button:hover{opacity:1;background:#ffffff0a}
.who{display:grid;gap:6px;padding:14px 18px 0;border-top:1px solid #ffffff1f;font-size:13px}
.who .role{justify-self:start;font-family:var(--f-mono);font-size:11px;padding:2px 6px;border:1px solid currentColor;border-radius:3px;opacity:.8}
.who button{justify-self:start;display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--bar-ink);border:1px solid #ffffff40;border-radius:4px;padding:4px 12px;cursor:pointer}
.who button svg{width:14px;height:14px}
/* menú contraído: solo íconos (no aplica en celular, donde el menú va arriba) */
@media (min-width:801px){
  .shell.collapsed .side{flex-basis:68px}
  .shell.collapsed .brand{padding:0;justify-content:center}
  .shell.collapsed .brand-t,.shell.collapsed nav.tabs .t,.shell.collapsed .who .nm,.shell.collapsed .who .role,.shell.collapsed .who .t{display:none}
  .shell.collapsed .side-toggle svg{transform:rotate(180deg)}
  .shell.collapsed .tab-n{position:absolute;top:4px;right:8px;padding:0 5px;font-size:10px}
  .shell.collapsed nav.tabs button{justify-content:center;padding:12px 4px 12px 0}
  .shell.collapsed .who{padding:14px 0 0;justify-items:center}
  .shell.collapsed .who button{justify-self:center;padding:6px 8px}
}
@media (prefers-reduced-motion:no-preference){.side{transition:flex-basis .18s ease}.side-toggle svg{transition:transform .18s ease}}
.conn{font-family:var(--f-mono);font-size:11px;opacity:.6}
.shell>main{flex:1;min-width:0}
@media (max-width:800px){
  .shell{display:block}
  .side{height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));overflow:visible}
  .brand{padding:0;flex:1;min-width:0}
  .brand h1{font-size:20px}
  .who{display:flex;align-items:center;gap:8px;padding:0;border:0}
  nav.tabs{order:3;flex:1 0 100%;flex-direction:row;overflow-x:auto;scrollbar-width:none}
  nav.tabs button{width:auto;flex:0 0 auto;border-left:0;border-bottom:3px solid transparent;padding:8px 10px;font-size:15px}
  nav.tabs button svg,.side-toggle{display:none}
  nav.tabs button[aria-current="page"]{border-bottom-color:var(--warn);background:transparent}
}

main{padding-block:20px 60px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.view-head p{margin:4px 0 0;color:var(--ink-2);max-width:70ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.panel>.ph{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel>.pb{padding:16px}
.stack{display:grid;gap:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* formularios */
form.row,.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fld{display:grid;gap:4px;min-width:0}
.fld label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
input,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:7px 9px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.w-xs{width:80px}.w-s{width:120px}.w-m{width:170px}.w-l{width:240px}
@media (max-width:520px){.w-l,.w-m{width:100%}.fld{flex:1 1 140px}}
.btn{font:600 13px var(--f-body);border-radius:4px;padding:8px 14px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);background:transparent;border-color:transparent;padding:4px 8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* tablas */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel-2)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2)}

/* pills andon */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-idle{background:var(--idle-soft);color:var(--idle)}
.p-acc{background:var(--accent-soft);color:var(--accent)}

/* surtido */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
@media (max-width:700px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
.summary>div{background:var(--panel);padding:12px 16px}
.summary .v{font:600 30px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.v.bad{color:var(--bad)} .v.ok{color:var(--ok)} .v.warn{color:var(--warn)}
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:16px}
.station .ph h3{display:flex;align-items:center;gap:10px}
.station .ph .st-id{font-family:var(--f-mono);font-size:12px;background:var(--bar);color:var(--bar-ink);padding:2px 7px;border-radius:3px}
.np-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.np-row:last-child{border-bottom:0}
.np-row .np{font-family:var(--f-mono);font-weight:500;font-size:14px}
.np-meta{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.np-meta b{color:var(--ink);font-weight:500;font-family:var(--f-mono)}
.np-act{display:flex;flex-direction:column;align-items:flex-end;gap:6px;justify-content:center}
.trips{grid-column:1/-1;display:flex;gap:3px;flex-wrap:wrap}
.trip{font-family:var(--f-mono);font-size:10.5px;padding:2px 5px;border-radius:3px;border:1px solid var(--line);color:var(--ink-2);background:var(--panel-2)}
.trip.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.trip.late{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.trip.due{background:var(--bad-soft);color:var(--bad);border-color:transparent;font-weight:600}
.trip.next{outline:2px solid var(--accent);outline-offset:-1px;color:var(--ink)}
.trip.stop{border-style:dashed;color:var(--ink-3)}
.plan-line{font-size:12px;color:var(--ink-2);margin-top:2px}
.recount-line{grid-column:1/-1;font-size:12px;color:var(--accent)}

/* control de línea: paros y arranque de ensambles */
.ctl-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center}
.ctl-row:last-child{border-bottom:0}
.ctl-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctl-line .st-id{font-family:var(--f-mono);font-size:13px;background:var(--bar);color:var(--bar-ink);padding:2px 8px;border-radius:3px}
.ctl-plans{grid-column:1/-1;display:grid;gap:6px}
.ctl-plan{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;font-size:13px}
.ctl-plan .grow{flex:1;min-width:0}
.bulk{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--line);font-size:13px}
.bulk label{display:flex;align-items:center;gap:6px;cursor:pointer}

/* líneas */
.lines{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px}
.line-card{border-top:6px solid var(--idle);overflow:hidden}
.line-card.st-ok{border-top-color:var(--ok)} .line-card.st-soon,.line-card.st-stop{border-top-color:var(--warn)} .line-card.st-due{border-top-color:var(--bad)}
.lc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 16px 0}
.lc-name{font:700 34px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.lc-pct{font:600 34px/1 var(--f-display)}
.st-due .lc-pct{color:var(--bad)} .st-ok .lc-pct{color:var(--ok)}
.lc-body{padding:10px 16px 16px;display:grid;gap:10px}
.lc-body .meter{margin-top:0}
.st-chips{display:flex;flex-wrap:wrap;gap:4px}
.st-chip{font:500 11px var(--f-mono);padding:3px 7px;border-radius:3px;background:var(--ok-soft);color:var(--ok)}
.st-chip.soon{background:var(--warn-soft);color:var(--warn)} .st-chip.due{background:var(--bad);color:#fff;font-weight:600}
.pend{display:grid;gap:4px;background:var(--bad-soft);border-radius:4px;padding:8px 10px}
.pend-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;font-size:12px;align-items:baseline}
.pend-row .mono:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.late-by{color:var(--bad);font-weight:600;font-size:11px;white-space:nowrap}

/* métricas */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
@media (max-width:800px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px 16px}
.kpi .v{font:600 36px/1 var(--f-display);font-variant-numeric:tabular-nums;margin-top:6px}
.kpi .s{font-size:12px;color:var(--ink-2);margin-top:4px}
.meter{height:6px;background:var(--idle-soft);border-radius:3px;overflow:hidden;margin-top:10px}
.meter>i{display:block;height:100%;background:var(--accent)}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:90px minmax(0,1fr) 110px;gap:10px;align-items:center;font-size:13px}
.bar-track{height:18px;background:var(--idle-soft);border-radius:3px;position:relative;overflow:hidden}
.bar-track>i{position:absolute;inset:0 auto 0 0;background:var(--ok)}
.bar-track>s{position:absolute;inset:0 auto 0 0;background:var(--warn);text-decoration:none}

/* login */
.login{min-height:70vh;display:grid;place-items:center;padding-block:40px}
.login .card{width:min(440px,100%);padding:28px}
.login h2{font-size:34px;text-transform:uppercase;letter-spacing:.03em}
.badge-in{font:500 28px var(--f-mono);letter-spacing:.12em;width:100%;padding:14px;text-align:center;margin-top:16px}
.hint{font-size:12px;color:var(--ink-2);margin-top:10px}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:1.2em}

/* modal */
.scrim{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:50;padding:16px}
.modal{width:min(520px,100%);max-height:90vh;overflow:auto}
.modal .pb{display:grid;gap:14px}
.scan-ok{font-size:13px;color:var(--ok);font-weight:600;min-height:1.2em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--bar);color:var(--bar-ink);padding:10px 16px;border-radius:5px;z-index:60;font-size:13px;max-width:calc(100% - 32px)}
.note{font-size:12px;color:var(--ink-2);background:var(--panel-2);border:1px dashed var(--line);border-radius:4px;padding:8px 10px}
@media (prefers-reduced-motion:no-preference){.np-row{transition:background .2s}}
</style>
</head>
<body>

<div class="shell">
<aside class="side" id="top" hidden>
  <div class="brand"><div class="brand-t"><h1>Surtido de Línea</h1><span class="tag" id="conn"></span></div>
    <button class="side-toggle" id="side-toggle" aria-controls="tabs" aria-expanded="true" aria-label="Contraer menú" title="Contraer menú"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button></div>
  <nav class="tabs" id="tabs" aria-label="Menú"></nav>
  <div class="who" id="who"></div>
</aside>
<main class="wrap" id="app"><div class="empty">Cargando…</div></main>
</div>
<div id="modal-root"></div>

<script>
/* ===================== Almacén: Supabase (tablas sl_*, una fila = {id, data jsonb}) =====================
   Cada tabla se lee completa (o filtrada por fecha) y se vuelve a leer cuando Realtime avisa de un cambio. */
const Store={
  sb:null, session:null, equipo:"",
  init(){ this.sb=window.supabase.createClient(SL_CONFIG.supabaseUrl,SL_CONFIG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true}}); },
  async fetch(col,filter){
    const out={}; let from=0;
    for(;;){
      let q=this.sb.from("sl_"+col).select("id,data");
      if(filter) q=q.eq("data->>"+filter.field,filter.value);
      const {data,error}=await q.order("id").range(from,from+999);
      if(error) throw error;
      data.forEach(r=>{out[r.id]=Object.assign({},r.data,{_id:r.id});});
      if(data.length<1000) break; from+=1000;
    }
    return out;
  },
  watch(col,cb,filter){
    let alive=true, timer=null;
    const load=async()=>{ try{ const m=await this.fetch(col,filter); if(alive) cb(m); }catch(e){ if(alive) toast("No se pudieron leer los datos ("+(e.message||e.code)+")."); } };
    const soon=()=>{ clearTimeout(timer); timer=setTimeout(load,250); };
    const ch=this.sb.channel("sl_"+col+"_"+newId())
      .on("postgres_changes",{event:"*",schema:"public",table:"sl_"+col},soon)
      .subscribe(st=>{ if(st==="SUBSCRIBED") soon(); });
    load();
    const onFocus=()=>soon(); window.addEventListener("focus",onFocus);
    return ()=>{ alive=false; clearTimeout(timer); this.sb.removeChannel(ch); window.removeEventListener("focus",onFocus); };
  },
  async set(col,id,data){
    const body=JSON.parse(JSON.stringify(data)); delete body._id;
    const {error}=await this.sb.from("sl_"+col).upsert({id,data:body,actualizado:new Date().toISOString()});
    if(error) throw error;
  },
  async insert(col,id,data){
    const body=JSON.parse(JSON.stringify(data)); delete body._id;
    const {error}=await this.sb.from("sl_"+col).insert({id,data:body});
    if(error) throw error;
  },
  async del(col,id){
    const {error}=await this.sb.from("sl_"+col).delete().eq("id",id);
    if(error) throw error;
  },
  async delMany(col,ids){
    for(let i=0;i<ids.length;i+=200){
      const {error}=await this.sb.from("sl_"+col).delete().in("id",ids.slice(i,i+200));
      if(error) throw error;
    }
  }
};
const safeId=s=>String(s).trim().replace(/[^A-Za-z0-9_\-.~:@+]/g,"-").slice(0,120)||"x";
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ===================== Estado ===================== */

/* ===================== Cálculo de surtido =====================
   Por NP en estación: consumo/h = UPH × cant. por unidad.
   Capacidad en estación = cantidad de empaque (o 1 h de consumo si no se indica).
   Punto de reorden = capacidad × %(mín. 20 %). Se surte al llegar a ese punto,
   reponiendo capacidad − punto de reorden. Frecuencia = reposición ÷ consumo/h.
   El programa corre en minutos de producción desde el arranque del ensamble: los paros de la línea
   no cuentan (los surtidos se recorren) y, mientras la línea está detenida, los surtidos siguientes quedan en pausa.
   Un reconteo reprograma los surtidos aún no confirmados a partir de lo que realmente hay en la estación. */
function shiftStart(fecha,turno){
  const t=cfg().turnos[turno]||{inicio:"06:00"}; const [h,m]=t.inicio.split(":").map(Number);
  const d=new Date(fecha+"T00:00:00"); d.setHours(h,m||0,0,0); return d;
}
// Arranque del ensamble: al inicio del turno, o cuando alguien presiona "Iniciar ensamble" (arranque manual).
function planStart(p){ if(p.inicioReal) return new Date(p.inicioReal); return p.arranque==="manual"?null:shiftStart(p.fecha,p.turno); }
function planUph(p){ return Number(p.uph)||Number(S.bom[safeId(p.ensamble)]?.uph)||0; }
function lineStops(fecha,linea){ return Object.values(S.eventos).filter(e=>e.tipo==="paro"&&e.fecha===fecha&&e.linea===linea); }
function activeStop(fecha,linea){ return lineStops(fecha,linea).find(e=>!e.fin)||null; }
function recountsOf(p,est,np){ return Object.values(S.eventos).filter(e=>e.tipo==="reconteo"&&e.planId===p._id&&e.estacion===est&&e.np===np).sort((a,b)=>a.ts-b.ts); }
// Convierte entre minutos de producción y hora real, saltando los paros de la línea.
function timeline(p,start){
  const stops=lineStops(p.fecha,p.linea).map(s=>[Math.max(s.inicio,start),s.fin||Infinity]).filter(([a,b])=>b>a).sort((x,y)=>x[0]-y[0]);
  return {
    wall(min){ let t=start, rem=min*60000;
      for(const [a,b] of stops){ if(b<=t) continue; if(a>t){ if(rem<=a-t) return t+rem; rem-=a-t; } if(b===Infinity) return Infinity; t=b; }
      return t+rem; },
    eff(T){ let t=start, m=0;
      for(const [a,b] of stops){ if(T<=t) break; if(b<=t) continue; if(a>t) m+=Math.min(T,a)-t; t=Math.max(t,b); }
      if(T>t) m+=T-t; return m/60000; }
  };
}
function computeItems(p){
  const b=S.bom[safeId(p.ensamble)]; if(!b) return {error:"Sin BOM para el ensamble "+p.ensamble, items:[]};
  const uph=planUph(p); if(!uph) return {error:"Falta UPH en el plan para "+p.ensamble, items:[]};
  const start=planStart(p); if(!start) return {waiting:true, items:[]};
  const pct=cfg().pct/100, tl=timeline(p,start.getTime());
  const items=(b.items||[]).map(it=>{
    const est=String(it.estacion||"—"), qpu=Number(it.qtyPer)||1, rate=uph*qpu;
    const cap=Number(it.empaque)>0?Number(it.empaque):Math.ceil(rate);
    const rop=Math.ceil(cap*pct), repl=Math.max(1,cap-rop);
    const intervalMin=repl/rate*60, total=Math.ceil(Number(p.cantidad)*qpu);
    const mk=(k,qty,eff)=>{ const w=tl.wall(eff); return {k,qty,eff,at:w===Infinity?null:new Date(w),id:safeId(p._id+"__"+it.estacion+"__"+it.np+"__"+k)}; };
    let trips=[], rem=total, k=0;
    while(rem>0 && k<500){
      const q=Math.min(k===0?cap:repl,rem);
      trips.push(mk(k,q,k*intervalMin));
      rem-=q; k++;
    }
    // Cada reconteo conserva los surtidos ya confirmados y reprograma el resto con lo contado en la estación.
    const recs=recountsOf(p,est,it.np);
    recs.forEach(r=>{
      const e=tl.eff(r.ts), qty=Number(r.cantidad)||0, consumed=Math.min(total,rate*e/60);
      trips=trips.filter(t=>t.k<r.kDesde&&S.surtidos[t.id]);
      let left=Math.max(0,Math.ceil(total-consumed-qty)), n=0;
      const first=e+Math.max(0,(qty-rop)/rate*60);
      while(left>0 && n<500){ const q=Math.min(repl,left); trips.push(mk(r.kDesde+n,q,first+n*intervalMin)); left-=q; n++; }
    });
    return {np:it.np,desc:it.desc,estacion:est,qpu,rate,cap,rop,repl,intervalMin,total,trips,recs,tl};
  });
  return {items};
}
// Piezas que deberían estar en la estación ahora: último reconteo (o cero) + surtidos confirmados después − consumo.
function estimateOnHand(it,now){
  const r=it.recs[it.recs.length-1], fromK=r?r.kDesde:0;
  const delivered=it.trips.filter(t=>t.k>=fromK&&S.surtidos[t.id]).reduce((n,t)=>n+(Number(S.surtidos[t.id].cantidad)||0),0);
  const used=it.rate*(it.tl.eff(now)-(r?it.tl.eff(r.ts):0))/60;
  return Math.max(0,Math.round((r?Number(r.cantidad):0)+delivered-used));
}
function tripStatus(t,now){
  const done=S.surtidos[t.id];
  if(done){ const late=!!t.at&&(done.ts-t.at.getTime())>cfg().tolerancia*60000; return {key:late?"late":"done",done}; }
  if(!t.at) return {key:"stop"};
  if(now>t.at.getTime()) return {key:"due"};
  if(t.at.getTime()-now<15*60000) return {key:"soon"};
  return {key:"sched"};
}

/* ===================== Arranque ===================== */
(async function boot(){
  const app=document.getElementById("app");
  if(!window.supabase||!window.SL_CONFIG){ app.innerHTML='<div class="panel empty">No se pudo cargar la conexión con Supabase. Revisa el internet del equipo y el archivo config.js.</div>'; return; }
  Store.init();
  Store.sb.auth.onAuthStateChange(ev=>{ if(ev==="SIGNED_OUT") location.reload(); });
  const {data:{session}}=await Store.sb.auth.getSession();
  if(!session) return renderDeviceLogin(app);
  Store.session=session;
  const {data:eq,error}=await Store.sb.from("sl_equipos").select("nombre").eq("user_id",session.user.id).maybeSingle();
  if(error||!eq) return renderNotAuthorized(app,session,error);
  Store.equipo=eq.nombre||session.user.email;
  try{ const b=sessionStorage.getItem("sl_me"); if(b) S.pendingBadge=b; }catch(e){}
  const pending=new Set(["gafetes","bom","plan","config","surtidos","eventos"]);
  const first=c=>m=>{ S[c]=m; pending.delete(c); if(!pending.size) S.ready=true; if(S.ready) render(); };
  ["gafetes","bom","plan","config"].forEach(c=>Store.watch(c,first(c)));
  watchDia(first);
  setInterval(()=>{ if(["surtido","metricas","lineas"].includes(S.view)) render(true); },30000);
})();
// Los surtidos y los eventos (paros, reconteos) se leen solo para la fecha seleccionada.
let diaUnsub=[], surtFecha=null;
function watchDia(first){
  diaUnsub.forEach(u=>u());
  surtFecha=S.sel.fecha; S.surtidos={}; S.eventos={};
  diaUnsub=["surtidos","eventos"].map(c=>Store.watch(c,first?first(c):(m=>{S[c]=m; render(true);}),{field:"fecha",value:surtFecha}));
}

function renderNotAuthorized(app,session,error){
  app.innerHTML=`<div class="login"><div class="card panel">

function login(badge){
  const u=userByBadge(badge); if(!u) return false;
  if(!ROLES[u.rol]||!ROLES[u.rol].tabs.length){ S.loginMsg=`${u.nombre} está registrado solo para recibir material; no tiene acceso a la app.`; return false; }
  S.me=u; try{ sessionStorage.setItem("sl_me",u.gafete); }catch(e){}
  S.view=ROLES[u.rol]?.tabs[0]||"surtido"; render(); return true;
}
function logout(){ S.me=null; S.view=null; try{ sessionStorage.removeItem("sl_me"); }catch(e){} render(); }

function render(soft){
  if(!S.ready) return;
  if(surtFecha!==S.sel.fecha) watchDia();
  if(S.me){ S.me=userByBadge(S.me.gafete); if(!S.me) return logout(); }
  if(!S.me && S.pendingBadge){ const b=S.pendingBadge; S.pendingBadge=null; if(login(b)) return; }
  const top=document.getElementById("top"), app=document.getElementById("app");
  if(!S.me){ top.hidden=true; if(!soft) renderLogin(app); return; }
  if(soft && document.querySelector(".scrim")) return;
  const active=document.activeElement; if(soft && active && active.matches("input,select") && app.contains(active)) return;
  top.hidden=false;
  const tabs=ROLES[S.me.rol].tabs; if(!tabs.includes(S.view)) S.view=tabs[0];
  const nPend=Object.values(S.plan).filter(p=>p.pendiente).length;
  document.getElementById("tabs").innerHTML=tabs.map(t=>`<button data-tab="${t}" ${S.view===t?'aria-current="page"':""} title="${TAB_LABEL[t]}" aria-label="${TAB_LABEL[t]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${TAB_ICON[t]}</svg><span class="t">${TAB_LABEL[t]}</span>${t==="plan"&&can.approve()&&nPend?`<span class="tab-n" title="${nPend} pendiente(s) de aprobación">${nPend}</span>`:""}</button>`).join("");
  document.getElementById("who").innerHTML=`<span class="nm">${esc(S.me.nombre)}</span><span class="role">${esc(ROLES[S.me.rol].label)}</span><button id="logout" title="Salir (${esc(S.me.nombre)})" aria-label="Salir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg><span class="t">Salir</span></button>`;
  document.getElementById("conn").textContent="● "+Store.equipo;
  ({lineas:viewLineas,surtido:viewSurtido,plan:viewPlan,bom:viewBom,metricas:viewMetricas,gafetes:viewGafetes})[S.view](app);
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab]"); if(t){ S.view=t.dataset.tab; render(); return; }
  if(e.target.closest("#logout")) logout();
  if(e.target.closest("#side-toggle")) setMenuCollapsed(!document.querySelector(".shell").classList.contains("collapsed"));
});

const ffv=id=>document.getElementById(id).value.trim();

/* ===================== Plan de producción =====================
   Un plan se postea cfg().anticipacion horas antes del inicio de su turno. Altas, cambios y bajas de planes que arrancan
   dentro de ese plazo (o ya arrancaron) quedan pendientes hasta que Gerencia o el administrador las aprueba: mientras tanto el plan vigente
   no cambia y un alta pendiente no genera surtidos. */
const PLAN_CAMPOS={cantidad:"Cantidad",uph:"UPH",turno:"Turno",linea:"Línea"};
const PEND_LABEL={alta:"Alta",cambio:"Cambio",baja:"Baja"};
function hoursAhead(p){ return (shiftStart(p.fecha,p.turno).getTime()-Date.now())/3600000; }
// Rolar: un plan posteado en tiempo y forma (creado con la anticipación requerida respecto a su turno original)
// se puede recorrer a un turno posterior sin aprobación, mientras no haya arrancado.
function planOrigen(p){ return p.original||{fecha:p.fecha,turno:p.turno}; }
function postedOnTime(p){ const o=planOrigen(p); return !!p.creado && (shiftStart(o.fecha,o.turno).getTime()-p.creado)/3600000>=cfg().anticipacion; }
function rollBlock(p){
  if(p.pendiente) return "Tiene una solicitud pendiente de aprobación.";
  if(!postedOnTime(p)) return `No se posteó con ${fmtHoras(cfg().anticipacion)} de anticipación; para moverlo usa Editar (requiere aprobación).`;
  if(p.inicioReal) return "El ensamble ya se inició.";
  return "";
}
function nextShift(fecha,turno){
  const ts=Object.keys(cfg().turnos), i=ts.indexOf(turno);
  if(i>=0&&i<ts.length-1) return {fecha,turno:ts[i+1]};
  const d=new Date(fecha+"T00:00:00"); d.setDate(d.getDate()+1);
  return {fecha:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),turno:ts[0]};
}
// Requiere aprobación si alguno de los planes (p. ej. el actual y el editado) inicia dentro del plazo.
function needsApproval(...plans){ return !can.approve() && plans.some(p=>hoursAhead(p)<cfg().anticipacion); }
const fmtHoras=h=>fmtN(h,1)+" h";
const fmtFechaHora=d=>d.toLocaleString("es-MX",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
function activePlans(){ return Object.values(S.plan).filter(p=>p.pendiente?.tipo!=="alta"); }
function histEntry(accion,extra){ return Object.assign({accion,ts:Date.now(),por:S.me.gafete,porNombre:S.me.nombre},extra||{}); }
function solicitud(tipo,extra){ return Object.assign({tipo,ts:Date.now(),por:S.me.gafete,porNombre:S.me.nombre},extra||{}); }
function withoutPend(p,accion){ const n=Object.assign({},p,{historial:[...(p.historial||[]),histEntry(accion,{solicito:p.pendiente?.porNombre||""})]}); delete n.pendiente; return n; }
function pendDetail(p){
  const q=p.pendiente;
  if(q.tipo==="alta") return `Agregar ${fmtN(p.cantidad)} pzs${planUph(p)?` a ${fmtN(planUph(p))} UPH`:""}`;
  if(q.tipo==="baja") return "Quitar del plan";
  return Object.entries(q.cambios||{}).map(([k,v])=>`${PLAN_CAMPOS[k]||k}: <span class="mono">${esc(p[k]??"—")}</span> → <b class="mono">${esc(v??"—")}</b>`).join("<br>");
}
async function resolvePlan(p,ok){
  const q=p.pendiente; if(!q) return;
  const accion=(ok?"aprobó ":"rechazó ")+q.tipo;
  if(q.tipo==="alta") return ok?Store.set("plan",p._id,withoutPend(p,accion)):Store.del("plan",p._id);
  if(q.tipo==="baja") return ok?Store.del("plan",p._id):Store.set("plan",p._id,withoutPend(p,accion));

    const next=Object.assign({},p,{fecha,turno,original:o,historial:[...(p.historial||[]),histEntry("roló",{de:p.fecha+" "+p.turno,a:fecha+" "+turno})]});

  };

function bindBomImport(){
  document.getElementById("xl-bom").onchange=e=>readXlsx(e.target.files[0],async rows=>{

      if(!ens||!np||!est){bad++;return;}
      const grp=groups[ens]=groups[ens]||{ensamble:ens,uph:null,items:[]};
      const u=Number(g(["uph"])); if(u) grp.uph=u;
      grp.items.push({np,desc:String(g(["descripcion","descripción","desc","descripcionnp"])||""),estacion:est,qtyPer:Number(g(["cantidadporunidad","cant/unidad","qtyper","cantidad","qty"]))||1,empaque:Number(g(["empaque","cantidadempaque","pack","capacidad"]))||null});
    });
    let n=0; for(const ens of Object.keys(groups)){ const k=safeId(ens), prev=S.bom[k]; const gr=groups[ens]; if(!gr.uph&&prev) gr.uph=prev.uph||null; await Store.set("bom",k,gr); n++; }
    toast(`BOM: ${n} ensambles cargados (reemplazan su lista de NP)${bad?`, ${bad} filas ignoradas`:""}.`);

/* ===================== Líneas: tablero de estado =====================
   Una línea está al 100 % cuando todos los surtidos cuya hora ya llegó están confirmados. */
function lineBoard(fecha,turno,now){
  const L={};
  activePlans().filter(p=>p.fecha===fecha&&(!turno||p.turno===turno)).forEach(p=>{
    const ln=L[p.linea]=L[p.linea]||{linea:p.linea,ens:new Set(),turnos:new Set(),ok:0,due:0,soon:0,total:0,done:0,pend:[],st:{},err:[],waiting:[],paro:activeStop(fecha,p.linea)};
    ln.ens.add(p.ensamble); ln.turnos.add(p.turno);
    const r=computeItems(p); if(r.error) ln.err.push(r.error); if(r.waiting) ln.waiting.push(p);
    r.items.forEach(it=>{
      const st=ln.st[it.estacion]=ln.st[it.estacion]||{due:0,soon:0};
      it.trips.forEach(t=>{ const s=tripStatus(t,now); ln.total++; if(s.done) ln.done++;
        if(t.at&&t.at.getTime()<=now){ if(s.done) ln.ok++; else {ln.due++; st.due++; ln.pend.push({p,it,t,min:(now-t.at.getTime())/60000});} }
        else if(s.key==="soon"){ ln.soon++; st.soon++; }
      });
    });
  });
  return Object.values(L).map(l=>{
    l.pct=l.ok+l.due?Math.floor(l.ok/(l.ok+l.due)*100):100;
    l.state=l.paro?"stop":l.err.length&&!l.total?"err":l.due?"due":l.soon?"soon":l.waiting.length&&!l.total?"wait":"ok";
    l.pend.sort((a,b)=>b.min-a.min); return l;
  }).sort((a,b)=>(b.due-a.due)||a.linea.localeCompare(b.linea,undefined,{numeric:true}));
}

        Estimado en estación según el programa: <b class="mono">≈ ${fmtN(est)} pzs</b> · punto de reorden ${fmtN(it.rop)} / ${fmtN(it.cap)}</div>
      <div class="fld"><label for="rc-q">Piezas contadas en la estación</label><input id="rc-q" type="number" min="0" step="1" class="badge-in" style="margin-top:0" inputmode="numeric" autocomplete="off"></div>
      <div class="fld"><label for="rc-m">Motivo</label><select id="rc-m">${motivos.map(m=>`<option>${m}</option>`).join("")}</select></div>
      <div class="fld"><label for="rc-n">Nota <span class="muted">(opcional)</span></label><input id="rc-n" autocomplete="off"></div>
      <p class="small muted" style="margin:0">Los surtidos ya confirmados se conservan; los pendientes se recalculan a partir de lo contado.</p>
      <div class="err" id="rc-err"></div>
      <div class="row" style="justify-content:flex-end"><button class="btn pri" id="rc-ok">Guardar reconteo</button></div>
    </div></div></div>`;
  const close=()=>root.innerHTML="";
  document.getElementById("rc-x").onclick=close;
  const q=document.getElementById("rc-q"); q.focus();
  q.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); document.getElementById("rc-ok").click(); } };
  document.getElementById("rc-ok").onclick=async e=>{
    const n=Number(q.value);
    if(q.value===""||!(n>=0)) return document.getElementById("rc-err").textContent="Escribe cuántas piezas hay en la estación.";
    e.target.disabled=true; const nota=ffv("rc-n");
    const ev={tipo:"reconteo",fecha:p.fecha,planId:p._id,linea:p.linea,ensamble:p.ensamble,estacion:it.estacion,np:it.np,cantidad:Math.round(n),esperado:est,kDesde,
      ts:Date.now(),motivo:ffv("rc-m")+(nota?" · "+nota:""),por:S.me.gafete,porNombre:S.me.nombre};
    if(await safeWrite(()=>Store.insert("eventos",newId(),ev))){ close(); toast(`Reconteo guardado: ${fmtN(n)} pzs de ${it.np}. Surtidos recalculados.`); }
    else e.target.disabled=false;
  };
}
function npRow({p,it,statuses,nxt},now){
  const cls={done:"done",late:"late",due:"due",soon:"",sched:"",stop:"stop"};
  const pillOf=k=>({due:'<span class="pill p-bad">Vencido</span>',soon:'<span class="pill p-warn">Próximo</span>',sched:'<span class="pill p-idle">Programado</span>',stop:'<span class="pill p-warn">Línea detenida</span>'}[k]);
  const allDone=!nxt, rc=it.recs[it.recs.length-1];
  return `<div class="np-row">
    <div style="min-width:0"><div class="np">${esc(it.np)} <span class="muted" style="font-family:var(--f-body);font-weight:400;font-size:13px">${esc(it.desc||"")}</span></div>
      <div class="plan-line">${esc(p.ensamble)} · ${esc(p.turno)} · ${fmtN(p.cantidad)} pzs</div>
      <div class="np-meta"><span>Cada <b>${fmtInterval(it.intervalMin)}</b></span><span>Surtir <b>${fmtN(it.repl)}</b></span><span>Reorden en <b>${fmtN(it.rop)}</b> / ${fmtN(it.cap)}</span><span>Consumo <b>${fmtN(it.rate,1)}</b>/h</span></div></div>
    <div class="np-act">${allDone?'<span class="pill p-ok">Completo</span>':`${pillOf(nxt.s.key)}<span class="mono small">${nxt.t.at?fmtT(nxt.t.at):"En pausa"} · ${fmtN(nxt.t.qty)} pzs</span>
      ${can.confirm()&&nxt.t.at?`<button class="btn ${nxt.s.key==="due"?"ok":"pri"}" data-confirm='${esc(JSON.stringify([p._id,nxt.t.k,it.estacion,it.np]))}'>Confirmar surtido</button>`:""}`}
      ${can.ops()?`<button class="btn ghost" data-recount='${esc(JSON.stringify([p._id,it.estacion,it.np]))}'>Recontar material</button>`:""}</div>
    ${rc?`<div class="recount-line">Reconteo ${fmtT(new Date(rc.ts))}: ${fmtN(rc.cantidad)} pzs (esperado ≈ ${fmtN(rc.esperado)}) · ${esc(rc.motivo)} · ${esc(rc.porNombre)}</div>`:""}
    <div class="trips" aria-label="Surtidos del turno">${statuses.map(x=>`<span class="trip ${cls[x.s.key]} ${nxt&&x===nxt?"next":""}" title="${x.s.done?"Surtió "+esc(x.s.done.surtioNombre)+" · recibió "+esc(x.s.done.recibioNombre)+" · "+fmtT(new Date(x.s.done.ts)):x.t.at?"Programado "+fmtT(x.t.at):"En pausa: línea detenida"}">${x.s.done&&!x.t.at?fmtT(new Date(x.s.done.ts)):x.t.at?fmtT(x.t.at):"pausa"}</span>`).join("")}</div>
  </div>`;
}
const fmtInterval=m=>m>=60?(Math.floor(m/60)+" h "+String(Math.round(m%60)).padStart(2,"0")+" min"):Math.max(1,Math.round(m))+" min";

function openConfirm(p,it,trip){
  const root=document.getElementById("modal-root");
  // Quien surte es el materialista con sesión; quien recibe solo escanea su gafete y con eso queda registrado.
  const s=S.me;
  if(!trip||!trip.at) return toast("La línea está detenida: el surtido queda en pausa hasta reanudarla.");
  root.innerHTML=`<div class="scrim"><div class="panel modal" role="dialog" aria-modal="true" aria-labelledby="mc-t">
    <div class="ph"><h3 id="mc-t">Confirmar surtido</h3><button class="btn ghost" id="mc-x">Cancelar</button></div>
    <div class="pb">
      <div class="note"><b class="mono">${esc(it.np)}</b> · ${fmtN(trip.qty)} pzs → Línea <b>${esc(p.linea)}</b>, estación <b>${esc(it.estacion)}</b><br>Programado ${fmtT(trip.at)} · surtido ${it.trips.indexOf(trip)+1} de ${it.trips.length} · Surte <b>${esc(s.nombre)}</b></div>
      <div class="fld"><label for="mc-r">Quien recibe: escanea su gafete</label><input id="mc-r" class="badge-in" style="margin-top:0" autocomplete="off" inputmode="numeric" placeholder="••••••"></div>
      <div class="err" id="mc-err"></div>
    </div></div></div>`;
  const close=()=>root.innerHTML="";
  document.getElementById("mc-x").onclick=close;
  const inp=document.getElementById("mc-r"), err=document.getElementById("mc-err");
  inp.focus();
  inp.onkeydown=async e=>{
    if(e.key!=="Enter") return; e.preventDefault(); err.textContent="";
    const r=userByBadge(inp.value);
    const fail=m=>{ err.textContent=m; inp.select(); };
    if(!r) return fail(`El gafete ${inp.value} no está registrado. Regístralo en la sección Gafetes.`);
    if(r.gafete===s.gafete) return fail("Quien recibe debe ser una persona distinta a quien surte.");
    const rec={planId:p._id,fecha:p.fecha,turno:p.turno,linea:p.linea,ensamble:p.ensamble,estacion:it.estacion,np:it.np,k:trip.k,
      programado:trip.at.getTime(),cantidad:trip.qty,ts:Date.now(),surtio:s.gafete,surtioNombre:s.nombre,recibio:r.gafete,recibioNombre:r.nombre};
    inp.disabled=true;
    const ok=await safeWrite(()=>Store.insert("surtidos",trip.id,rec));
    if(ok){ close(); toast(`Surtido registrado: ${it.np} en ${p.linea}/${it.estacion}. Recibió ${r.nombre}.`); }
    else { inp.disabled=false; inp.select(); }
  };
}

/* ===================== Métricas ===================== */
function viewMetricas(app){
  const c=cfg(), now=Date.now();
  const plans=activePlans().filter(p=>p.fecha===S.sel.fecha&&(!S.sel.turno||p.turno===S.sel.turno));
  const byLine={}; let tot=0,done=0,onTime=0,due=0,delays=[];
  plans.forEach(p=>computeItems(p).items.forEach(it=>it.trips.forEach(t=>{
    const s=tripStatus(t,now); const L=byLine[p.linea]=byLine[p.linea]||{tot:0,ok:0,late:0,due:0};
    tot++; L.tot++;
    if(s.done){done++; if(s.key==="done"){onTime++;L.ok++;}else L.late++; if(t.at) delays.push((s.done.ts-t.at.getTime())/60000);}
    else if(s.key==="due"){due++;L.due++;}
  })));
  const recs=Object.values(S.surtidos).filter(r=>r.fecha===S.sel.fecha&&(!S.sel.turno||r.turno===S.sel.turno)).sort((a,b)=>b.ts-a.ts);
  const byMat={}; recs.forEach(r=>{const m=byMat[r.surtio]=byMat[r.surtio]||{nombre:r.surtioNombre,n:0,pzs:0,late:0}; m.n++; m.pzs+=Number(r.cantidad)||0; if(r.ts-r.programado>c.tolerancia*60000) m.late++;});
  const vencidosAhora=due;
  const evs=Object.values(S.eventos).filter(e=>e.fecha===S.sel.fecha&&(!S.sel.turno||e.tipo==="paro"||S.plan[e.planId]?.turno===S.sel.turno)).sort((a,b)=>(b.ts||b.inicio)-(a.ts||a.inicio));
  const pct=(a,b)=>b?Math.round(a/b*100):0;
  const avgDelay=delays.length?delays.reduce((a,b)=>a+b,0)/delays.length:0;
  const elapsed=plans.reduce((n,p)=>n+computeItems(p).items.reduce((m,it)=>m+it.trips.filter(t=>t.at&&t.at.getTime()<=now).length,0),0);
  const lines=Object.keys(byLine).sort();
  app.innerHTML=`
  <div class="view-head"><div><h2>Métricas de surtido</h2><p>Cumplimiento contra el programa calculado del plan. "A tiempo" = confirmado dentro de ${c.tolerancia} min de la hora programada.</p></div></div>
  <div class="filters">
    <div class="fld"><label for="m-fecha">Fecha</label><input type="date" id="m-fecha" value="${S.sel.fecha}"></div>
    <div class="fld"><label for="m-turno">Turno</label><select id="m-turno"><option value="">Todos</option>${Object.keys(c.turnos).map(t=>`<option ${S.sel.turno===t?"selected":""}>${t}</option>`).join("")}</select></div>
  </div>
  <div class="kpis">
    <div class="panel kpi"><div class="lbl">Cumplimiento a la fecha</div><div class="v">${pct(done,elapsed)}%</div><div class="s">${done} de ${elapsed} surtidos que ya tocaban</div><div class="meter"><i style="width:${pct(done,elapsed)}%"></i></div></div>
    <div class="panel kpi"><div class="lbl">A tiempo</div><div class="v">${pct(onTime,done)}%</div><div class="s">${onTime} de ${done} confirmados</div><div class="meter"><i style="width:${pct(onTime,done)}%;background:var(--ok)"></i></div></div>
    <div class="panel kpi"><div class="lbl">Vencidos ahora</div><div class="v ${vencidosAhora?"bad":""}" style="${vencidosAhora?"color:var(--bad)":""}">${vencidosAhora}</div><div class="s">Sin confirmar después de su hora</div></div>
    <div class="panel kpi"><div class="lbl">Retraso promedio</div><div class="v">${delays.length?fmtN(avgDelay,1):"—"}<span style="font-size:18px"> min</span></div><div class="s">${tot} surtidos programados en el día</div></div>
  </div>
  <div class="grid2" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
    <div class="panel"><div class="ph"><h3>Por línea</h3><span class="small muted"><span class="pill p-ok">A tiempo</span> <span class="pill p-warn">Tarde</span></span></div><div class="pb">
      ${lines.length?`<div class="bars">${lines.map(l=>{const L=byLine[l];return`<div class="bar-row"><b>${esc(l)}</b>
        <div class="bar-track" title="${L.ok} a tiempo, ${L.late} tarde, ${L.due} vencidos de ${L.tot}"><s style="width:${pct(L.ok+L.late,L.tot)}%"></s><i style="width:${pct(L.ok,L.tot)}%"></i></div>
        <span class="mono small">${L.ok+L.late}/${L.tot}${L.due?` · <span style="color:var(--bad)">${L.due} venc.</span>`:""}</span></div>`}).join("")}</div>`:`<div class="empty">Sin plan para esta fecha.</div>`}
    </div></div>
    <div class="panel"><div class="ph"><h3>Por materialista</h3></div><div class="tbl-wrap"><table>
      <thead><tr><th>Materialista</th><th class="num">Surtidos</th><th class="num">Piezas</th><th class="num">Tarde</th></tr></thead>
      <tbody>${Object.keys(byMat).length?Object.entries(byMat).sort((a,b)=>b[1].n-a[1].n).map(([g,m])=>`<tr><td>${esc(m.nombre)} <span class="muted mono small">${esc(g)}</span></td><td class="num">${m.n}</td><td class="num">${fmtN(m.pzs)}</td><td class="num">${m.late}</td></tr>`).join(""):`<tr><td colspan="4" class="empty">Sin surtidos confirmados.</td></tr>`}</tbody></table></div></div>
  </div>
  <div class="panel" style="margin-top:16px"><div class="ph"><h3>Bitácora de surtidos</h3><span class="muted small">${recs.length} registros</span></div><div class="tbl-wrap"><table>
    <thead><tr><th>Hora</th><th>Prog.</th><th>Línea</th><th>Estación</th><th>NP</th><th class="num">Cant.</th><th>Surtió</th><th>Recibió</th><th>Estado</th></tr></thead>
    <tbody>${recs.length?recs.slice(0,200).map(r=>{const late=r.ts-r.programado>c.tolerancia*60000;return`<tr><td class="mono">${fmtT(new Date(r.ts))}</td><td class="mono muted">${fmtT(new Date(r.programado))}</td><td>${esc(r.linea)}</td><td>${esc(r.estacion)}</td><td class="mono">${esc(r.np)}</td><td class="num">${fmtN(r.cantidad)}</td><td>${esc(r.surtioNombre)}</td><td>${esc(r.recibioNombre)}</td><td>${late?'<span class="pill p-warn">Tarde</span>':'<span class="pill p-ok">A tiempo</span>'}</td></tr>`}).join(""):`<tr><td colspan="9" class="empty">Aún no hay surtidos confirmados en esta fecha.</td></tr>`}</tbody></table></div></div>
  <div class="panel" style="margin-top:16px"><div class="ph"><h3>Paros y reconteos</h3><span class="muted small">${evs.length} registros</span></div><div class="tbl-wrap"><table>
    <thead><tr><th>Hora</th><th>Tipo</th><th>Línea</th><th>Detalle</th><th>Motivo</th><th>Registró</th></tr></thead>
    <tbody>${evs.length?evs.map(e=>e.tipo==="paro"?`<tr><td class="mono">${fmtT(new Date(e.inicio))}</td><td><span class="pill p-warn">Paro</span></td><td>${esc(e.linea)}</td>
      <td>${e.fin?`Hasta ${fmtT(new Date(e.fin))} · ${ago((e.fin-e.inicio)/60000)}`:`<b style="color:var(--warn)">En curso</b> · ${ago((now-e.inicio)/60000)}`}</td><td>${esc(e.motivo||"")}</td><td>${esc(e.porNombre||"")}</td></tr>`
      :`<tr><td class="mono">${fmtT(new Date(e.ts))}</td><td><span class="pill p-acc">Reconteo</span></td><td>${esc(e.linea)}</td>
      <td><span class="mono">${esc(e.estacion)} · ${esc(e.np)}</span> · ${fmtN(e.cantidad)} pzs (esperado ≈ ${fmtN(e.esperado)})</td><td>${esc(e.motivo||"")}</td><td>${esc(e.porNombre||"")}</td></tr>`).join("")
      :`<tr><td colspan="6" class="empty">Sin paros ni reconteos en esta fecha.</td></tr>`}</tbody></table></div></div>`;
  document.getElementById("m-fecha").onchange=e=>{S.sel.fecha=e.target.value;render();};
  document.getElementById("m-turno").onchange=e=>{S.sel.turno=e.target.value;render();};
}

/* ===================== Gafetes y ajustes ===================== */
function viewGafetes(app){
  const c=cfg(); const q=(S.sel.qGaf||"").toLowerCase();
  const all=Object.values(S.gafetes).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const us=all.filter(u=>!q||(u.gafete+" "+u.nombre+" "+(u.area||"")).toLowerCase().includes(q));
  const roleOpts=sel=>Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${sel===k?"selected":""}>${v.label}</option>`).join("");
  app.innerHTML=`
  <div class="view-head"><div><h2>Gafetes</h2><p>Registro de cada gafete y la persona a la que pertenece. Quien recibe material en línea solo necesita estar registrado aquí; el rol define si además puede entrar a la app y qué ve.</p></div>

  <div class="grid2">
    <div class="stack">
      <div class="panel"><div class="ph"><h3>Registrar gafete</h3></div><div class="pb"><form id="f-user" class="stack">

        <div class="fld"><label for="u-r">Rol</label><select id="u-r">${roleOpts("receptor")}</select></div>
        <button class="btn pri">Registrar gafete</button></form></div></div>
      <div class="panel"><div class="ph"><h3>Parámetros de surtido</h3></div><div class="pb"><form id="f-cfg" class="stack">
        <div class="row"><div class="fld"><label for="c-pct">Punto de reorden %</label><input id="c-pct" type="number" min="20" max="90" value="${c.pct}" class="w-xs"></div>
        <div class="fld"><label for="c-tol">Tolerancia min</label><input id="c-tol" type="number" min="0" value="${c.tolerancia}" class="w-xs"></div>
        <div class="fld"><label for="c-ant">Anticipación del plan (horas)</label><input id="c-ant" type="number" min="0" step="0.5" value="${c.anticipacion}" class="w-xs" title="Horas antes del inicio del turno. Altas, cambios o bajas con menos anticipación requieren aprobación de Gerencia. 0 = no se requiere aprobación."></div></div>
        ${Object.entries(c.turnos).map(([t,v])=>`<div class="row"><div class="fld"><label>${t}</label><span class="mono">Turno</span></div>
          <div class="fld"><label for="c-${t}-i">Inicio</label><input type="time" id="c-${t}-i" value="${v.inicio}"></div>
          <div class="fld"><label for="c-${t}-f">Fin</label><input type="time" id="c-${t}-f" value="${v.fin}"></div></div>`).join("")}
        <p class="small muted" style="margin:0">El punto de reorden nunca baja de 20%. Con anticipación 0, el plan se modifica sin aprobación de Gerencia.</p>
        <button class="btn pri">Guardar parámetros</button></form></div></div>
    </div>
    <div class="panel"><div class="ph"><h3>Gafetes registrados</h3>
      <div class="row"><input id="g-q" placeholder="Buscar gafete, nombre o área" value="${esc(S.sel.qGaf||"")}" aria-label="Buscar gafete"><span class="muted small">${us.length} de ${all.length}</span></div></div>
      <div class="tbl-wrap"><table>
      <thead><tr><th>Gafete</th><th>Nombre</th><th>Área</th><th>Rol</th><th></th></tr></thead>
      <tbody>${us.length?us.map(u=>`<tr><td class="mono">${esc(u.gafete)}</td><td>${esc(u.nombre)}</td><td>${esc(u.area||"")}</td>
        <td><select data-rol="${u._id}" aria-label="Rol de ${esc(u.nombre)}" ${u.gafete===S.me.gafete?"disabled":""}>${roleOpts(u.rol)}</select></td>
        <td>${u.gafete===S.me.gafete?'<span class="muted small">Tú</span>':`<button class="btn danger" data-del-user="${u._id}">Dar de baja</button>`}</td></tr>`).join(""):`<tr><td colspan="5" class="empty">Ningún gafete coincide con la búsqueda.</td></tr>`}</tbody></table></div></div>
  </div>`;
  const gq=document.getElementById("g-q");

    toast(`Gafetes: ${n} registrados o actualizados${bad?`, ${bad} filas sin gafete o nombre`:""}.`);
  });
  document.getElementById("f-cfg").onsubmit=async e=>{e.preventDefault();
    const turnos={}; Object.keys(c.turnos).forEach(t=>turnos[t]={inicio:ffv(`c-${t}-i`),fin:ffv(`c-${t}-f`)});
    const pct=Math.max(20,Number(ffv("c-pct"))||20);
    if(await safeWrite(()=>Store.set("config","general",{pct,tolerancia:Number(ffv("c-tol"))||0,anticipacionHoras:Math.max(0,Number(ffv("c-ant"))||0),turnos}))) toast("Parámetros guardados");};
  app.querySelectorAll("[data-rol]").forEach(s=>s.onchange=()=>{const u=S.gafetes[s.dataset.rol]; safeWrite(()=>Store.set("gafetes",u._id,Object.assign({},u,{rol:s.value})));});
  app.querySelectorAll("[data-del-user]").forEach(b=>b.onclick=()=>{const u=S.gafetes[b.dataset.delUser]; confirmBox(`¿Dar de baja a ${u.nombre}?`,"Dar de baja",()=>safeWrite(()=>Store.del("gafetes",u._id)));});
}

/* ===================== Utilidades ===================== */
async function safeWrite(fn){
  try{ await fn(); return true; }
  catch(e){ const code=e&&e.code;
    toast(code==="23505"?"Este surtido ya fue confirmado por otra persona.":
      code==="42501"?"Este equipo no tiene permiso para guardar. Pide al administrador que lo autorice.":
      /fetch|network/i.test(e.message||"")?"Sin conexión. Revisa el internet y vuelve a intentar.":
      "No se pudo guardar ("+(e.message||code)+").");
    return false; }
}
function confirmBox(msg,label,fn){
  const root=document.getElementById("modal-root");
  root.innerHTML=`<div class="scrim"><div class="panel modal" role="dialog" aria-modal="true"><div class="pb"><p style="margin:0">${esc(msg)}</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" id="cb-n">Cancelar</button><button class="btn pri" id="cb-y">${esc(label)}</button></div></div></div></div>`;
  document.getElementById("cb-n").onclick=()=>root.innerHTML="";
  document.getElementById("cb-y").onclick=()=>{root.innerHTML=""; fn();};
}
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[\s_]/g,"");
function pick(row,keys){ const nk=keys.map(norm); for(const k of Object.keys(row)){ if(nk.includes(norm(k))) return row[k]; } return undefined; }
function xlDate(v){
  if(v==null||v==="") return "";
  if(v instanceof Date) return v.getFullYear()+"-"+String(v.getMonth()+1).padStart(2,"0")+"-"+String(v.getDate()).padStart(2,"0");
  if(typeof v==="number"){ const d=new Date(Math.round((v-25569)*86400000)); return d.toISOString().slice(0,10); }
  const s=String(v).trim(); let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/); if(m){ const y=m[3].length===2?"20"+m[3]:m[3]; return y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0"); }
  return "";
}
function readXlsx(file,cb){
  if(!file) return; if(!window.XLSX) return toast("No se pudo cargar el lector de Excel. Revisa tu conexión.");
  const fr=new FileReader();
  fr.onload=async()=>{ try{ const wb=XLSX.read(new Uint8Array(fr.result),{type:"array",cellDates:true});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
      if(!rows.length) return toast("El archivo no tiene filas.");
      await cb(rows);
    }catch(e){ toast("No se pudo leer el archivo: "+e.message); } };
  fr.readAsArrayBuffer(file);
}
async function downloadXlsx(name,aoa){
  if(!window.XLSX) return toast("No se pudo cargar el generador de Excel.");
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),"Datos");
  const data=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  let dl=null; try{ dl=window.claude&&await window.claude.use("downloads"); }catch(e){}
  if(dl){ try{ await dl.save({filename:name,data:new Uint8Array(data)}); }catch(e){ if(e.code!=="declined") toast("No se pudo descargar ("+e.code+")."); } return; }
  try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data])); a.download=name; a.click(); }
  catch(e){ toast("Columnas: "+aoa[0].join(", ")); }
}
